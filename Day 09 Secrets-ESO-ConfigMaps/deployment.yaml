apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: app1
  name: app1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - image: kiran2361993/troubleshootingtools:v1
          name: configsecrets
      imagePullSecrets:
        - name: docker-pwd
